name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del núcleo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk cumulo-hoops-0.2.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cumulo-hoops-apk
          path: cumulo-hoops-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Cúmulo Hoops 0.2.${{ github.run_number }}
          body: |
            Descargá el APK desde el celular e instalalo (permitir "instalar apps desconocidas").
            Cambios: ${{ github.event.head_commit.message }}
          files: cumulo-hoops-*.apk
          make_latest: true
