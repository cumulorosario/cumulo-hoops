name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del núcleo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Clave de firma privada
        env:
          KS: ${{ secrets.HOOPS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/cumulo.jks"
            echo "HOOPS_KEYSTORE_FILE=$RUNNER_TEMP/cumulo.jks" >> "$GITHUB_ENV"
            echo "Firma: clave privada de Cúmulo Ingeniería"
          else
            echo "::warning::Faltan los secretos de firma: el APK se firma con la clave de pruebas pública"
          fi

      - name: Compilar
        env:
          HOOPS_KEYSTORE_PASSWORD: ${{ secrets.HOOPS_KEYSTORE_PASSWORD }}
          HOOPS_KEY_PASSWORD: ${{ secrets.HOOPS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/cumulo.jks"

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk cumulo-hoops-0.2.${{ github.run_number }}.apk

      - name: Versión para PC (.jar con las mismas pantallas)
        run: |
          ./gradlew --no-daemon :pc:jar
          mkdir -p cumulo-hoops-pc
          cp pc/build/libs/cumulo-hoops-pc.jar pc/iniciar.bat cumulo-hoops-pc/
          zip -r cumulo-hoops-pc-0.2.${{ github.run_number }}.zip cumulo-hoops-pc

      - uses: actions/upload-artifact@v4
        with:
          name: cumulo-hoops
          path: |
            cumulo-hoops-*.apk
            cumulo-hoops-pc-*.zip

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Cúmulo Hoops 0.2.${{ github.run_number }}
          body: |
            **Celular Android:** descargá el `.apk` desde el celular e instalalo (permitir "instalar apps desconocidas").
            **PC (opcional):** descargá el `.zip`, descomprimilo y abrí `iniciar.bat` (requiere Java 17 o superior).

            Cambios: ${{ github.event.head_commit.message }}
          files: |
            cumulo-hoops-*.apk
            cumulo-hoops-pc-*.zip
          make_latest: true
