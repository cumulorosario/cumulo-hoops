<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero · Cúmulo Hoops</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#04060b; --panel:#0b101c; --line:#1a2236; --amber:#fbbf24; --muted:#8090a8;
          --mono: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { font-variant-numeric: tabular-nums; box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #e8edf5; overflow: hidden;
               font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .board { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding: 2.5vh 2vw; }
  /* Fila superior: marca a la izquierda, categoría a la derecha */
  .top { display: grid; grid-template-columns: auto 1fr; gap: 3vw; align-items: center; height: 12vh; margin-bottom: 1vh; }
  .appbrand { display: flex; align-items: center; gap: 1.4vw; min-width: 0; }
  .appbrand img { height: 10vh; width: auto; display: block; }
  .appbrand i { display: block; flex: none; width: .15vw; height: 7.5vh; background: rgba(111,153,202,.45); }
  .appbrand b { font-size: 2.1vw; font-weight: 800; color: #e8edf5; white-space: nowrap; letter-spacing: .02em; }
  .title { text-align: right; font-size: 2.2vw; font-weight: 800; letter-spacing: .15em; color: var(--amber);
           text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .main { flex: 1; display: flex; min-height: 0; }
  .team { flex: 1; background: var(--panel); border: .15vw solid var(--line); border-top: 1vh solid var(--c, #888);
          border-radius: 1.6vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2.5vh 1vw; }
  .center { flex: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 1.5vw; }
  .thead { display: flex; align-items: center; justify-content: center; height: 7.5vw; width: 100%; padding: 0 .5vw; }
  .crest { flex: none; width: 6.5vw; height: 6.5vw; margin-right: 1.2vw; display: none; }
  .crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .crest.on { display: block; }
  .tname { font-size: 2.5vw; font-weight: 800; text-align: center; line-height: 1.12; max-height: 7.5vw;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .crest.on + .tname { text-align: left; justify-content: flex-start; }
  .score { font-family: var(--mono); font-weight: 700; font-size: 14vw; line-height: 1; color: var(--c, #fff); text-shadow: 0 0 2.5vw; }
  .stats { display: flex; text-align: center; }
  .stats > div { margin: 0 1.8vw; }
  .stats small { display: block; font-size: 1.15vw; color: var(--muted); letter-spacing: .12em; font-weight: 700; }
  .stats b { font-size: 4vw; font-family: var(--mono); }
  .bonus { font-size: 1.3vw; font-weight: 900; background: var(--amber); color: #000; padding: .4vh 1.2vw;
           border-radius: .5vw; letter-spacing: .25em; visibility: hidden; }
  .period { font-size: 2.1vw; color: var(--muted); letter-spacing: .3em; font-weight: 800; }
  .clock { font-family: var(--mono); font-weight: 700; font-size: 10vw; color: var(--amber); text-shadow: 0 0 2.5vw; line-height: 1.15; }
  .clock.paused { opacity: .8; }
  .shotrow { display: flex; align-items: center; margin-top: 2vh; }
  .shot { font-family: var(--mono); font-weight: 700; font-size: 7vw; color: #ff3b30; text-shadow: 0 0 2vw; background: #000;
          border: .15vw solid var(--line); border-radius: 1vw; min-width: 15vw; text-align: center; padding: 0 1vw; line-height: 1.15; margin: 0 2vw; }
  .shot.low { color: #ff1f1f; }
  .shot.zero { animation: blink .5s steps(2) infinite; }
  .shot-label { font-size: 1vw; color: var(--muted); letter-spacing: .3em; font-weight: 700; margin-top: 1vh; }
  .arrow { width: 0; height: 0; border-top: 2.4vw solid transparent; border-bottom: 2.4vw solid transparent; opacity: .1; }
  #arrow-home { border-right: 3.4vw solid var(--hc, #fff); }
  #arrow-away { border-left: 3.4vw solid var(--ac, #fff); }
  .arrow.on { opacity: 1; }
  .bottom { display: flex; margin-top: 2vh; height: 12vh; align-items: flex-start; }
  .oncourt { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; }
  #away-players { justify-content: flex-end; }
  .oncourt + .oncourt { margin-left: 1.5vw; }
  .chip { background: var(--panel); border: .12vw solid var(--line); border-radius: .6vw; padding: .5vh .7vw; margin: 0 .5vw .8vh 0;
          font-size: 1.35vw; display: flex; align-items: center; white-space: nowrap; }
  .chip b { color: var(--c); font-family: var(--mono); margin-right: .5vw; }
  .chip .ph { width: 2.1vw; height: 2.1vw; border-radius: 50%; object-fit: cover; margin-right: .5vw; border: .12vw solid var(--c); }
  .chip .nm { max-width: 11vw; overflow: hidden; text-overflow: ellipsis; }
  .dots { margin-left: .6vw; }
  .dots i { display: inline-block; width: .7vw; height: .7vw; border-radius: 50%; background: #263049; margin-left: .2vw; }
  .dots i.f { background: #f59e0b; }
  .dots i.x { background: #ef4444; }
  .conn { position: fixed; top: 1vh; right: 1vw; background: #7f1d1d; color: #fff; font-weight: 800; font-size: 1.2vw;
          padding: .5vh 1vw; border-radius: .5vw; display: none; letter-spacing: .1em; }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.82); color: #fff; border: 0;
             font-size: 2.4vw; font-weight: 700; cursor: pointer; }
  .overlay small { display: block; font-size: 1.3vw; color: var(--muted); margin-top: 2vh; font-weight: 400; }
  @keyframes blink { 50% { opacity: .15; } }
</style>
</head>
<body>
<div class="board">
  <div class="top">
    <div class="appbrand"><img src="/img/cumulo-logo.png" alt="Cúmulo Ingeniería"><i></i><b>Cúmulo Hoops</b></div>
    <div class="title" id="title"></div>
  </div>
  <div class="main">
    <div class="team" id="home">
      <div class="thead"><div class="crest" id="home-crest"></div><div class="tname" id="home-name"></div></div>
      <div class="score" id="home-score">0</div>
      <div class="stats">
        <div><small>FALTAS</small><b id="home-fouls">0</b></div>
        <div><small>T. MUERTOS</small><b id="home-to">0</b></div>
      </div>
      <div class="bonus" id="home-bonus">BONUS</div>
    </div>
    <div class="center">
      <div class="period" id="period">CUARTO 1</div>
      <div class="clock" id="clock">8:00</div>
      <div class="shotrow">
        <div class="arrow" id="arrow-home"></div>
        <div class="shot" id="shot">24</div>
        <div class="arrow" id="arrow-away"></div>
      </div>
      <div class="shot-label">POSESIÓN</div>
    </div>
    <div class="team" id="away">
      <div class="thead"><div class="crest" id="away-crest"></div><div class="tname" id="away-name"></div></div>
      <div class="score" id="away-score">0</div>
      <div class="stats">
        <div><small>FALTAS</small><b id="away-fouls">0</b></div>
        <div><small>T. MUERTOS</small><b id="away-to">0</b></div>
      </div>
      <div class="bonus" id="away-bonus">BONUS</div>
    </div>
  </div>
  <div class="bottom">
    <div class="oncourt" id="home-players"></div>
    <div class="oncourt" id="away-players"></div>
  </div>
</div>
<div class="conn" id="conn">SIN CONEXIÓN</div>
<button class="overlay" id="overlay">Tocar o presionar OK para activar sonido y pantalla completa
  <small>Si la chicharra no suena, revisá el volumen de la TV</small></button>
<script src="/js/common.js"></script>
<script src="/js/tablero.js"></script>
</body>
</html>
