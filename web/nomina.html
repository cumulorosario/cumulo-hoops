<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nómina · Cúmulo Hoops</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/operador.css">
<style>
  .bar .sp { flex: 1; }
  .nom { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; max-width: 1300px; margin: 0 auto; align-items: start; }
  @media (max-width: 900px) { .nom { grid-template-columns: 1fr; padding: 8px; } }
  .club { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
  .club .crest.big { width: 120px; height: 120px; cursor: pointer; }
  .club-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .club-btns button { font-size: 13px; padding: 7px 8px; }
  .club form { display: flex; flex-direction: column; gap: 8px; }
  .club label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .club input { font: inherit; color: var(--text); background: #070b15; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .club input[type=color] { padding: 2px; height: 38px; }
  .club .row3 { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
  .saved { color: #6ee7b7; font-size: 13px; min-height: 18px; }
  @media (max-width: 420px) { .club { grid-template-columns: 1fr; } }

  .roster-head { display: flex; justify-content: space-between; align-items: flex-end; margin: 18px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .nr { display: grid; grid-template-columns: 44px 40px 1fr auto 44px 40px; gap: 8px; align-items: center; padding: 7px 6px; border-radius: 12px; }
  .nr + .nr { border-top: 1px solid #141c2e; }
  .nr .avatar { width: 40px; height: 40px; font-size: 13px; cursor: pointer; }
  .nr .pnum { font-size: 18px; text-align: right; }
  .nr .pname { font-size: 16px; }
  .nr .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .nr .court { width: 40px; height: 40px; padding: 0; border-radius: 50%; color: var(--muted); font-size: 15px; }
  .nr.on .court { background: var(--c); border-color: var(--c); color: #000; }
  .nr .edit { padding: 8px 0; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .add-player { width: 100%; margin-top: 10px; border-style: dashed; color: var(--muted); padding: 12px; }
  .paste { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .paste summary { cursor: pointer; font-weight: 700; color: var(--muted); }
  .paste textarea { width: 100%; margin-top: 8px; font: 13px ui-monospace, Consolas, monospace; color: var(--text); background: #070b15; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .paste .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
</style>
</head>
<body>
<header class="bar">
  <div class="cb-brand"><img src="/img/cumulo-isotipo.png" alt=""><div><b>Nómina y formaciones</b><small>Desarrollado por <em>Cúmulo Ingeniería</em></small></div></div>
  <div class="conn" id="conn"><i></i><span>Conectando…</span></div>
  <span class="sp"></span>
  <div class="bar-actions"><a class="btn" href="/operador">← Mesa de control</a></div>
</header>

<main class="nom">
  <section class="team" id="home" data-team="home"></section>
  <section class="team" id="away" data-team="away"></section>
</main>

<footer class="cb-foot"><div class="cb-card"><span>Desarrollado<br>por</span><img src="/img/cumulo-logo.png" alt="Cúmulo Ingeniería"></div></footer>

<!-- Jugador: número, nombre, foto -->
<dialog id="dlg-player">
  <form method="dialog" id="player-form">
    <h2 id="player-title">Jugador</h2>
    <div class="photo-edit">
      <div class="avatar big" id="player-photo-view"></div>
      <div class="photo-btns">
        <button type="button" id="player-photo" class="primary">📷 Foto del jugador</button>
        <button type="button" id="player-photo-rm" class="danger">Quitar foto</button>
        <small id="player-photo-hint"></small>
      </div>
    </div>
    <div class="two num-name">
      <label>Número<input name="num" inputmode="numeric" pattern="#?[0-9]{1,3}" maxlength="4" required></label>
      <label>Nombre y apellido<input name="name" maxlength="40" autocomplete="off"></label>
    </div>
    <label class="check"><input type="checkbox" name="onCourt"> En cancha (titular)</label>
    <div class="pstats" id="player-stats"></div>
    <div class="dlg-actions">
      <button type="button" id="player-remove" class="danger">Quitar del plantel</button>
      <span></span>
      <button type="button" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>
<script src="/js/common.js"></script>
<script src="/js/fotos.js"></script>
<script src="/js/nomina.js"></script>
</body>
</html>
