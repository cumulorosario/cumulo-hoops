<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reloj 24 · Cúmulo Hoops</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --mono: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { font-variant-numeric: tabular-nums; box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { position: absolute; top: 0; left: 21vw; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .arrows { display: flex; align-items: center; height: 8vh; }
  .arrow { width: 0; height: 0; border-top: 3.5vh solid transparent; border-bottom: 3.5vh solid transparent; opacity: .1; margin: 0 3vw; }
  #arrow-home { border-right: 5vh solid var(--hc, #fff); }
  #arrow-away { border-left: 5vh solid var(--ac, #fff); }
  .arrow.on { opacity: 1; }
  .tag { font-size: 5vh; font-weight: 800; letter-spacing: .15em; min-width: 20vw; text-align: center; }
  .shot { font-family: var(--mono); font-weight: 700; font-size: min(46vw, 69vh); line-height: 1; color: #ff2a2a; text-shadow: 0 0 4vw; }
  .shot.zero { animation: blink .5s steps(2) infinite; }
  .game { font-family: var(--mono); font-size: min(7vw, 11vh); color: #fbbf24; line-height: 1.1; }
  .game span { font-size: .5em; color: #8090a8; margin-right: 2vw; }
  /* Marca en una columna a la izquierda: deja todo el alto para el número */
  .brand { position: fixed; top: 0; bottom: 0; left: 0; width: 21vw; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 2.4vh; padding: 0 1.5vw; border-right: 2px solid rgba(111,153,202,.18); }
  .brand img { width: 100%; height: auto; display: block; }
  .brand i { width: 60%; height: 2px; background: rgba(111,153,202,.45); }
  .brand b { font-size: min(5vh, 2.3vw); font-weight: 800; color: #e8edf5; white-space: nowrap; }
  body.solo .game, body.solo .arrows { display: none; }
  body.solo .shot { font-size: min(54vw, 86vh); }
  /* Con centésimas (9.99) el número es más ancho: se achica para que entre */
  .shot.fine { font-size: min(29vw, 69vh); }
  body.solo .shot.fine { font-size: min(34vw, 86vh); }
  .conn { position: fixed; top: 1vh; right: 1vw; background: #7f1d1d; font-weight: 800; font-size: 3vh; padding: .5vh 1vw; border-radius: .5vw; display: none; }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.85); color: #fff; border: 0; font-size: 3.5vw; font-weight: 700; cursor: pointer; }
  @keyframes blink { 50% { opacity: .15; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="arrows"><div class="arrow" id="arrow-home"></div><div class="tag" id="tag"></div><div class="arrow" id="arrow-away"></div></div>
  <div class="shot" id="shot">24</div>
  <div class="game"><span id="period">Q1</span><b id="clock">8:00</b></div>
</div>
<div class="brand"><img src="/img/cumulo-logo.png" alt="Cúmulo Ingeniería"><i></i><b>Cúmulo Hoops</b></div>
<div class="conn" id="conn">SIN CONEXIÓN</div>
<button class="overlay" id="overlay">Tocar o presionar OK para activar<br>sonido y pantalla completa</button>
<script src="/js/common.js"></script>
<script>
(function () {
  var H = window.Hoops, S = null;
  function $(id) { return document.getElementById(id); }
  if (/solo/.test(location.search)) document.body.className = 'solo';
  if (/mudo/.test(location.search)) H.checkBuzzer = function () {};

  function render(s) {
    S = s;
    document.documentElement.style.setProperty('--hc', s.home.color);
    document.documentElement.style.setProperty('--ac', s.away.color);
    $('arrow-home').className = 'arrow' + (s.possession === 'home' ? ' on' : '');
    $('arrow-away').className = 'arrow' + (s.possession === 'away' ? ' on' : '');
    var t = s.possession ? s[s.possession] : null;
    $('tag').textContent = t ? t.short : '';
    $('tag').style.color = t ? t.color : '#fff';
    $('period').textContent = H.periodLabel(s);
    H.checkBuzzer(s);
    tick();
  }
  var lastShot = null, lastClock = null, lastCls = null;
  function tick() {
    if (!S) return;
    var sh = H.rem(S.shot), vis = H.shotVisible(S);
    var st = vis ? H.fmtShot(sh) : '';
    if (st !== lastShot) { $('shot').innerHTML = st || '&nbsp;'; lastShot = st; }
    var cls = 'shot' + (vis && sh <= 0 ? ' zero' : '') + (vis && H.isFine(sh) ? ' fine' : '');
    if (cls !== lastCls) { $('shot').className = cls; lastCls = cls; }
    var ct = H.fmtGame(H.rem(S.clock));
    if (ct !== lastClock) { $('clock').textContent = ct; lastClock = ct; }
  }
  H.loop(tick);
  H.setupOverlay('overlay');
  H.connect(render, function (ok) { $('conn').style.display = ok ? 'none' : 'block'; }, 'posesion');
})();
</script>
</body>
</html>
