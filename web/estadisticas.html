<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas · Cúmulo Hoops</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/css/brand.css">
<style>
  :root { --bg: #060912; --panel: #0d1322; --panel2: #121a2c; --line: #1f2a40; --text: #e6ebf4; --muted: #8391a8; --amber: #fbbf24; }
  * { box-sizing: border-box; font-variant-numeric: tabular-nums; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #080c17; flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  .btn { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #111; font-weight: 800; }
  .btn.wa { background: #128c4a; border-color: #128c4a; color: #fff; font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .share { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }

  .match { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; text-align: center; }
  .meta { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .meta b { color: var(--amber); }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 14px 0 6px; }
  .tm { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .tm .crest { width: 72px; height: 72px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 20px; background: rgba(255,255,255,.04); border: 1px solid var(--line); overflow: hidden; }
  .tm .crest img { width: 100%; height: 100%; object-fit: contain; }
  .tm b { font-size: 17px; line-height: 1.2; }
  .big { font-size: 56px; font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
  .big .h { color: var(--hc); } .big .a { color: var(--ac); } .big i { color: var(--muted); font-style: normal; margin: 0 .2em; }
  .state { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 999px; background: var(--panel2); color: var(--muted); font-size: 13px; font-weight: 700; }
  .state.final { background: rgba(16,185,129,.15); color: #6ee7b7; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #172036; }
  th { font-size: 11px; letter-spacing: .1em; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  td.l, th.l { text-align: left; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 14px; overflow-x: auto; }
  .card h2 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); display: inline-block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } .big { font-size: 42px; } }
  .num { color: var(--c); font-weight: 800; width: 2.6em; }
  .pts { font-weight: 800; font-size: 16px; }
  .ph { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; border: 2px solid var(--c); }
  .ini { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; vertical-align: middle; margin-right: 8px; background: #1a2338; font-size: 11px; font-weight: 800; color: #c7d2e4; }
  tr.tot td { font-weight: 800; border-top: 2px solid var(--line); border-bottom: 0; }
  tr.top td.pts { color: var(--amber); }
  .f5 { color: #fca5a5; font-weight: 800; }
  .muted { color: var(--muted); font-size: 13px; }

  /* vista previa de la imagen (cuando el navegador no puede compartir directo) */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px; z-index: 20; }
  .ov.on { display: flex; }
  .ov img { max-width: min(520px, 100%); max-height: 72vh; border-radius: 12px; background: #fff; }
  .ov p { color: #cbd5e1; text-align: center; max-width: 520px; margin: 0; line-height: 1.45; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2a40; color: #fff; padding: 10px 16px; border-radius: 10px; display: none; z-index: 30; }
</style>
</head>
<body>
<header class="bar">
  <div class="cb-brand"><img class="cb-logo" src="/img/cumulo-logo.png" alt="Cúmulo Ingeniería"><i class="cb-sep"></i><div><b>Cúmulo Hoops</b><small>Estadísticas</small></div></div>
  <span class="sp"></span>
  <a class="btn" href="/operador">← Mesa de control</a>
</header>
<main>
  <div class="share">
    <button class="btn primary" id="share-img">🖼 Compartir imagen</button>
    <button class="btn wa" id="share-txt">💬 Compartir texto (WhatsApp)</button>
    <button class="btn" id="share-csv">📄 Planilla (CSV / Excel)</button>
  </div>
  <section class="match" id="match"></section>
  <section class="card" id="periods"></section>
  <div class="grid2">
    <section class="card" id="box-home"></section>
    <section class="card" id="box-away"></section>
  </div>
  <p class="muted" style="text-align:center;margin-top:14px">TL: libres convertidos · 2P: dobles · 3P: triples · F: faltas personales. Los puntos cargados sin elegir jugador cuentan solo para el equipo.</p>
</main>

<div class="ov" id="ov">
  <img id="ov-img" alt="Estadísticas del partido">
  <p>Mantené presionada la imagen para guardarla o compartirla, o descargala con el botón.</p>
  <div style="display:flex;gap:8px"><a class="btn primary" id="ov-dl" download="estadisticas.png">⬇ Descargar</a><button class="btn" id="ov-close">Cerrar</button></div>
</div>
<div id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/estadisticas.js"></script>
</body>
</html>
